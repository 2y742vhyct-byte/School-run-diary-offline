<!doctype html>
<html lang="en-IE">
<head>
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#0b2145"><meta name="apple-mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-status-bar-style" content="default">
 <meta name="apple-mobile-web-app-title" content="School Run Diary">
 <meta name="description" content="Private offline school bus driving diary, pupils, boards and backups">
 <link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png">
 <link rel="icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./styles.css?v=6">
 <title>School Run Diary • Offline</title>
</head>
<body>
 <div id="auth" class="auth-screen"></div>
 <div id="shell" class="shell" hidden>
  <header class="topbar"><div class="topbar-inner"><div class="brand"><div class="bus-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="16" rx="3"/><path d="M4 11h16M8 19v2M16 19v2M8 7h.01M16 7h.01M8 15h2M14 15h2"/></svg></div><div><strong>School Run <span>Diary</span></strong><small>Schools · Rehab · LMETB</small></div></div><div class="top-actions"><span class="offline-pill" id="networkPill">Offline ready</span><button class="icon-button" data-action="lock" title="Lock diary" aria-label="Lock diary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button></div></div></header>
  <main id="main" class="main" tabindex="-1"></main>
  <nav class="bottom-nav" aria-label="Main sections">
   <button data-action="tab" data-tab="diary" class="active" aria-label="Home dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-7h6v7"/></svg><small>Home</small>
   </button>
   <button data-action="tab" data-tab="routes" aria-label="Routes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="19" r="2"/><path d="M9 19h7a5 5 0 0 0 0-10H8a4 4 0 0 1 0-8h7"/><circle cx="18" cy="3" r="2"/></svg><small>Routes</small>
   </button>
   <button data-action="tab" data-tab="pupils" aria-label="Pupils and contacts">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 21v-2a6 6 0 0 1 12 0v2M17 11a3 3 0 0 0 0-6M17 15c2.2.4 4 2.2 4 4v2"/></svg><small>Pupils</small>
   </button>
   <button data-action="tab" data-tab="boards" aria-label="Operating boards">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 3v18M3 9h18M3 15h18"/></svg><small>Boards</small>
   </button>
   <button data-action="tab" data-tab="more" aria-label="Reports and backups">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="7" cy="7" r="1" fill="currentColor"/><circle cx="17" cy="12" r="1" fill="currentColor"/></svg><small>More</small>
   </button>
  </nav>
 </div>
 <dialog id="modal" class="modal"><div id="modalBody"></div></dialog>
 <div id="toast" class="toast" role="status" aria-live="polite"></div>
 <script src="./app.js?v=6" defer></script>
</body>
</html>
